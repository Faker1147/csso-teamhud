// ===========================================================================
//  CSSO 2.0 - 队友头显 (Team HUD)  配置文件
//  适用: CSSO 2.0 (Source Offensive) / Counter-Strike: Source / CS:GO
//  放置位置: <游戏目录>/cfg/sourcemod/csso2.cfg
//           CSSO 2.0 是 csso/cfg/sourcemod/csso2.cfg
//  插件第一次加载时会自动生成此文件, 上面的值就是默认值。
//
//  排错: sm_csso_dump      (把自己身上的实测数据打进控制台和 SourceMod 日志)
//        sm_csso_tagtest   (打印头顶名牌的投影参数: FOV / 宽高比 / 每人屏幕坐标)
//        sm_csso_fonttest  (显示中英文样张, 判断客户端 HUD 字体能否渲染中文)
// ===========================================================================

// 0 = 关闭头显, 1 = 开启头显
csso_hud_enabled 1

// 头显刷新间隔 (秒), 建议 0.1 - 0.5, 越小越跟手但越费性能
csso_hud_interval 0.2

// 最多显示几名队友 (1 - 8)
csso_hud_max_rows 5

// 显示级别: 0 = 名字 + 金钱
//           1 = 再加 生命 / 护甲 / 武器(含弹匣备弹)
//           2 = 再加 道具 / 拆弹器 / C4 / 电击枪 (完整)
csso_hud_detail 2

// 是否把自己也显示在头显列表里 (0 = 只看别人)
csso_hud_show_self 0

// 1 = 只显示存活队友, 0 = 阵亡队友也显示 (标记 [DEAD], 方便看下一局经济)
csso_hud_alive_only 0

// 是否显示生命值和护甲
csso_hud_health 1

// 排序: 0 = 玩家顺序, 1 = 金钱从高到低
csso_hud_sort 1

// 头显坐标 (0.0 - 1.0), 默认在左侧中间偏上, 避开雷达和血条
csso_hud_x 0.02
csso_hud_y 0.40

// 颜色: 0 = 跟随队伍(T橙/CT蓝), 1 = 白, 2 = 绿, 3 = 橙, 4 = 青
//       5 = 每行独立状态色 (阵亡灰 / 残血红 / 掉血橙, 需配合 csso_hud_line_height)
//       6 = CSSO 2.0 原生队伍色 (取自模组 clientscheme.res 的 TeamT / TeamCT)
csso_hud_color 0

// 语言: 0 = 英文, 1 = 中文标签 + 投掷物/装备, 2 = 再加武器中文名
//       开之前请先用 sm_csso_fonttest 确认你的客户端 HUD 字体能渲染中文
csso_hud_lang 0

// csso_hud_color 5 时每行的高度 (行重叠或间隔过大时调它)
csso_hud_line_height 0.025

// 1 = 把引擎识别值和所有属性偏移打印到服务器控制台 (排查问题时打开)
//     更详细的单玩家实测数据请用游戏内命令 sm_csso_dump
//     打开后换图, logs/L<日期>.log 里还会多一行 [debug] RestartTimer: ... hudTimer=ok,
//     用来确认"头显不刷新"时刷新定时器到底还活着没有
csso_hud_debug 0

// ===========================================================================
//  头顶名牌 (队友名字 + 血量% 浮在头顶, 只对同队可见)
// ===========================================================================

// 0 = 关闭头顶名牌, 1 = 开启 (玩家仍可用 !tags 单独关掉自己那份)
csso_tag_enabled 1

// 显示内容: 0 = 名字 + 血量%, 1 = 再加当前武器, 2 = 只有名字
csso_tag_mode 0

// 颜色: 0 = 队伍色, 1 = 固定黄, 2 = 按血量变色
csso_tag_color 0

// 最大显示距离 (游戏单位), 0 = 不限
csso_tag_max_dist 3000

// 名牌相对队友眼睛的高度 (蹲下时会跟着降低; 名牌盖住脑袋就调大, 飘太高就调小)
csso_tag_height 12

// 1 = 被墙挡住时不显示 (防透视, 推荐), 0 = 一直显示
csso_tag_visible_only 1

// 名牌刷新间隔 (秒): 越小越平滑但越耗带宽, 建议 0.02 - 0.10
csso_tag_interval 0.05

// 水平视野角 (4:3 基准的 fov), 0 = 自动读客户端 m_iFOV (默认 90)
csso_tag_fov 0

// 客户端画面宽高比: 16:9 = 1.7778, 16:10 = 1.6, 4:3 = 1.3333
csso_tag_aspect 1.7778

// 居中用的单字符宽度估算 (名牌整体偏右就调大, 偏左就调小)
csso_tag_char_width 0.008

// 1 = 敌方玩家也显示头顶名牌 (注意: 比赛服会被视为透视辅助, 默认只显示同队)
csso_tag_enemies 0

// 1 = 阵亡的玩家也显示名牌 (显示 [阵亡] + 经济), 0 = 只显示活着的
csso_tag_dead 1

// 名牌上的额外信息 (位开关, 可相加):
//   1 = 经济($)   2 = 当前武器   4 = 道具/装备
//   例如 3 = 经济 + 武器 (默认), 7 = 全都要, 0 = 只要名字 + 血量%
csso_tag_extra 3

// 1 = 只在准星指着其他玩家时才显示名牌 (CS:GO 那种, 默认)
// 0 = 只要在视野里就一直显示 (这时才用得上 csso_tag_dead / csso_tag_visible_only)
csso_tag_aim_only 1
