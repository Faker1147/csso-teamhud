// ===========================================================================
//  CSSO 2.0 - 队友头显 (Team HUD)  配置文件
//  放置位置: csgo/cfg/sourcemod/csso2.cfg
//  插件第一次加载时会自动生成此文件, 上面的值就是默认值。
// ===========================================================================

// 0 = 关闭头显, 1 = 开启头显
csso_hud_enabled 1

// 头显刷新间隔 (秒), 建议 0.1 - 0.5, 越小越跟手但越费性能
csso_hud_interval 0.2

// 最多显示几名队友 (1 - 8)
csso_hud_max_rows 5

// 显示级别: 0 = 名字 + 金钱
//           1 = 再加 生命 / 护甲 / 武器(含弹匣备弹)
//           2 = 再加 道具 / 拆弹器 / C4 / 电击枪 (完整)
csso_hud_detail 2

// 是否把自己也显示在头显里
csso_hud_show_self 1

// 1 = 只显示存活队友, 0 = 阵亡队友也显示 (标记 [DEAD], 方便看下一局经济)
csso_hud_alive_only 0

// 是否显示生命值和护甲
csso_hud_health 1

// 排序: 0 = 玩家顺序, 1 = 金钱从高到低
csso_hud_sort 1

// 头显坐标 (0.0 - 1.0), 默认在左侧中间偏上, 避开雷达和血条
csso_hud_x 0.02
csso_hud_y 0.40

// 颜色: 0 = 跟随队伍(T橙/CT蓝), 1 = 白, 2 = 绿, 3 = 橙, 4 = 青
csso_hud_color 0

// 1 = 把网络属性偏移打印到服务器控制台 (排查问题时打开)
csso_hud_debug 0
